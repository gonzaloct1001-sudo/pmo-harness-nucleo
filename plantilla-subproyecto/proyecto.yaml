# ============================================================
# Subproyecto de un programa. Lo que no se defina aquí (cliente, formato, marca, logo, autoría, umbrales, reportes)
# se hereda del proyecto.yaml del programa. Lo que se define aquí prevalece.
# ============================================================

programa: "../.."              # carpeta del programa (no cambiar)

proyecto:
  nombre: PENDIENTE
  slug: PENDIENTE              # id del subproyecto (carpeta)
  codigo: ""
  descripcion: PENDIENTE       # una o dos frases
  fecha_inicio: PENDIENTE      # AAAA-MM-DD

objetivos: []                  # objetivos propios del subproyecto (medibles)

arquetipos: [ejecucion]        # el subproyecto puede usar además agil, obra u otro

responsable:
  nombre: PENDIENTE
  cargo: ""
  correo: ""

linea_base:                    # línea base del SUBPROYECTO según el contrato padre y sus enmiendas
  fecha_termino_vigente: PENDIENTE   # AAAA-MM-DD (puede cambiar por una enmienda: ver contractual/afectaciones.csv del programa)
  monto_vigente: PENDIENTE           # presupuesto asignado al subproyecto (debe cuadrar con presupuesto/ del programa)
  documento_vigente: ""              # C00, E01, ... que fijó estos valores
  ultima_actualizacion: ""

cronograma_actualizado: ""     # AAAA-MM-DD de la última actualización del avance real

formato: {}                    # vacío = usa el formato y la marca del programa; define solo lo que cambie

induccion:
  estado: pendiente
  bloques_completos: []
  pendientes: []
  ultima_actualizacion: ""
