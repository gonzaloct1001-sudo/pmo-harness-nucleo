# ============================================================
# Configuración del proyecto — la leen todas las skills.
# Valores "PENDIENTE" se completan en nuevo-proyecto.
# Mientras estén pendientes, las skills usan los valores por defecto.
# Los arquetipos pueden agregar bloques propios (ej.: ejecucion agrega linea_base).
# ============================================================

proyecto:
  nombre: Finanzas de Distribuidora Valle Sur (ficticio)
  slug: finanzas-demo              # nombre de la carpeta, sin espacios ni tildes
  codigo: ""
  cliente: "Distribuidora Valle Sur (ficticia)"                  # cliente, mandante o "uso personal"
  descripcion: "Gestión financiera ficticia: presupuesto 2026, cierres mensuales, estados de gestión y proyección."       # una o dos frases
  fecha_inicio: 2026-01-05      # AAAA-MM-DD
  confidencialidad: alta       # alta | media | baja

arquetipos: [finanzas]                 # ejecucion | cartera | estudio (uno o más). Ver arquetipos/
perfil: ""                     # perfil de biblioteca usado como base, si aplica

responsable:
  nombre: Controller (demo)
  cargo: ""
  correo: ""

gobierno:
  sponsor: ""                  # quién patrocina o responde (puede ser el mismo responsable)
  aprueba_decisiones: ""       # quién aprueba decisiones relevantes
  comite:
    nombre: ""
    frecuencia: ""

reportes:
  semana_inicia: lunes
  catalogo: reportes/catalogo/

formato:
  idioma: es-CL
  formato_fecha: DD-MM-AAAA
  tamano_pagina: carta         # carta | a4
  logo: marca/logo.png         # si no existe, los documentos salen sin logo
  color_primario: "1F3864"     # hexadecimal sin #
  color_secundario: "2E75B6"
  fuente: Arial
  pie_de_pagina: "Documento confidencial"

autoria:                       # los documentos entregables salen a nombre del usuario, sin rastros del proceso
  nombre: ""                   # autor en las propiedades de Word/Excel/PowerPoint (vacío = responsable.nombre)
  organizacion: ""             # empresa en las propiedades (opcional)
  patron_nombre_archivo: "{tipo}_{periodo}"   # nombre de los emitidos; {tipo} {periodo} {slug} {codigo}
  terminos_prohibidos: []      # términos adicionales que nunca deben aparecer en un entregable
  terminos_permitidos: []      # términos que en este proyecto son legítimos (ej.: "inteligencia artificial", "gemini")
  excluir: []                  # archivos que no se verifican ni modifican: de terceros o declaraciones exigidas (ej.: "carta-*.pdf", "declaracion-uso-ia.docx")

umbrales:
  desvio_amarillo_pct: 5
  desvio_rojo_pct: 10
  dias_revision_riesgos: 30

induccion:
  estado: pendiente            # pendiente | parcial | completa
  bloques_completos: []
  pendientes: []
  ultima_actualizacion: ""

finanzas:                      # [finanzas] gestión financiera; detalle en finanzas/
  moneda: CLP
  anio_fiscal_inicio: 1        # mes en que empieza el año fiscal (1 = enero)
  sistema_contable: "Contabilidad ficticia (exporta balance de comprobación en Excel)"         # de dónde salen las exportaciones (nombre del sistema)
  version_presupuesto: "2026-v1"      # versión vigente del presupuesto (columna version de presupuesto.csv)
  version_forecast: "2026-fc-09"   # versión vigente del forecast
  aprueba_presupuesto: "Directorio (demo)"      # quién aprueba el presupuesto anual
  aprueba_cierre: "Gerente general (demo)"           # quién da por cerrado cada mes
  dia_cierre: 10               # día hábil objetivo del cierre mensual
